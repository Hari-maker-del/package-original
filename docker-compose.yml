services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: packsure_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d packsure_ai"]
      interval: 5s
      timeout: 5s
      retries: 10
  ai:
    build: ./ai-ml
    environment:
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      TESSERACT_LANG: ${TESSERACT_LANG:-eng+hin+tam+mal+tel}
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 15
  api:
    build: ./backend
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/packsure_ai
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in a .env file to a random value of at least 32 characters}
      AI_SERVICE_URL: http://ai:8000
      FRONTEND_URL: http://localhost
      PUBLIC_API_URL: http://localhost
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      ANALYZE_RATE_LIMIT: ${ANALYZE_RATE_LIMIT:-20}
      UPLOAD_DIR: /app/uploads
    depends_on:
      db: { condition: service_healthy }
      ai: { condition: service_healthy }
    ports: ["5000:5000"]
    volumes:
      - api_uploads:/app/uploads
  frontend:
    build: ./frontend
    depends_on: [api]
    ports: ["80:80"]
volumes:
  postgres_data:
  api_uploads:
